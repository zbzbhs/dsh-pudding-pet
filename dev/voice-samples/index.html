 font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

<h1>布丁变声试听</h1>
<p class="sub">同一个句子、不同变声强度。时长已保持（不是简单加速）。选一个你满意的，我把它设为默认。</p>
<figure><figcaption>pitch 1.00 · +0.0 半音</figcaption><audio controls preload="none" src="pitch-1.00.wav"></audio></figure>
<figure><figcaption>pitch 1.35 · +5.2 半音</figcaption><audio controls preload="none" src="pitch-1.35.wav"></audio></figure>
<figure><figcaption>pitch 1.70 · +9.2 半音</figcaption><audio controls preload="none" src="pitch-1.70.wav"></audio></figure>
<figure><figcaption>pitch 2.00 · +12.0 半音</figcaption><audio controls preload="none" src="pitch-2.00.wav"></audio></figure>
<figure><figcaption>pitch 2.40 · +15.2 半音</figcaption><audio controls preload="none" src="pitch-2.40.wav"></audio></figure>
<figure><figcaption>pitch 2.80 · +17.8 半音</figcaption><audio controls preload="none" src="pitch-2.80.wav"></audio></figure>
<div class="note">
  浏览器 <code>speechSynthesis</code> 的 <code>pitch</code> 上限是 2.0，且它的输出无法被捕获做后处理。<br>
  上面这些是<b>宿主侧合成 + 重采样变调</b>的结果——重采样会同时抬高基频和共振峰，这正是“卡通嗓”听起来对的原因。<br>
  参考：pitch 1.35 ≈ 浏览器 2.0 附近的听感；1.7 起明显卡通化；2.4 以上开始发尖。
</div>
</body></html>
