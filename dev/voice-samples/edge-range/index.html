<div class="note">
  <b>怎么读这张表：</b>从某个值开始哈希不再变化，说明已到服务端上限。<br>

  <b>若还不够强：</b>客户端播放时可再叠加 <code>playbackRate</code>（同时改变音高与时长，即经典「花栗鼠」效果）。
